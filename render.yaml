services:
  - type: web
    name: nawaz-traders-erp
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nawaz-traders-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nawaz-traders-db
    databaseName: nawaz_traders
    user: nawaz_user
    plan: free
