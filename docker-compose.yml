services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: nawaz_traders_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-7860}
      POSTGRES_DB: ${DB_NAME:-nawaz_traders}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Next.js ERP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawaz_traders_erp
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-7860}@postgres:5432/${DB_NAME:-nawaz_traders}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super-secret-grain-erp-jwt-key-change-in-production-2026}
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
