services:
  # 1. Production PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nawaz_traders_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nawaz_traders_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Production ERP Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawaz_traders_erp_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
    driver: local
