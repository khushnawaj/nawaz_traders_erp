services:
  # Local Development Database Service
  postgres-dev:
    image: postgres:15-alpine
    container_name: nawaz_traders_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-7860}
      POSTGRES_DB: ${DB_NAME:-nawaz_traders_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
